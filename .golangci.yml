version: "2"

linters:
  enable:
    - bodyclose
    - errorlint
    - gocritic
    - misspell
    - nilerr
    - revive
    - unconvert
  settings:
    errcheck:
      # Deferred Close on response bodies and streams is a read path; there is nothing useful to do with the error.
      exclude-functions:
        - (io.ReadCloser).Close
        - (github.com/Haklifesavr/switchyard/internal/provider.Stream).Close
    misspell:
      locale: US
      ignore-rules: [behaviour, authorisation, cancelled]
    revive:
      rules:
        - name: exported
        - name: package-comments
        - name: var-naming
  exclusions:
    rules:
      - path: _test\.go
        linters: [bodyclose, revive]

formatters:
  enable:
    - gofmt
