# Switchyard plus Prometheus. Start with: docker compose up --build
# Gateway: http://localhost:8080   Prometheus: http://localhost:9090
services:
  switchyard:
    build: .
    ports:
      - "8080:8080"
    environment:
      - OPENAI_API_KEY
      - ANTHROPIC_API_KEY
    volumes:
      - ./config.example.yaml:/etc/switchyard/config.yaml:ro
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.5.0
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - switchyard
